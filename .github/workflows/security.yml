name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Run weekly on Monday at 7am UTC to catch newly disclosed vulnerabilities
    - cron: "0 7 * * 1"

permissions:
  contents: read
  security-events: write  # Required for CodeQL SARIF upload

jobs:
  govulncheck:
    name: Vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        # Pinned: govulncheck @latest (x/tools v0.46.0) panics with
        # "ForEachElement called on type containing *types.TypeParam" during
        # symbol-level SSA analysis of generics under Go 1.26.x. v1.1.4 is the
        # last release without that regression. The vulnerability database is
        # fetched fresh at runtime regardless of tool version, so coverage is
        # unaffected. Revisit once a fixed govulncheck release is out.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run govulncheck
        run: govulncheck ./...

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.7
        with:
          languages: go

      - name: Build
        run: make build

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.37.7
