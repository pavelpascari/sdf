version: 2

builds:
  - main: .
    binary: sdf
    ldflags:
      - -s -w -X main.version={{.Version}}
    flags:
      - -trimpath
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

homebrew_casks:
  - repository:
      owner: pavelpascari
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/pavelpascari/sdf
    description: Stacked Diffs Flow — manage chains of dependent PRs
    license: MIT
    install: |
      bin.install "sdf"
    test: |
      system "#{bin}/sdf", "version"
